<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TI-30XS MultiView Simulator</title>
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://unpkg.com/d3@3/d3.min.js"></script>
    <script src="https://unpkg.com/function-plot@1/dist/function-plot.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <style>
        :root {
            --calc-bg: #3c4858;
            --lcd-bg: #9fb1a7;
            --btn-dark: #3a3a3a;
            --btn-white: #fefefe;
            --btn-green: #90b343;
            --btn-shadow: #1a1a1a;
            --label-yellow: #f1e05a;
            --text-lcd: #2a332d;
            --menu-bg: rgba(159, 177, 167, 0.98);
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: white;
        }

        #app-container {
            display: flex;
            gap: 40px;
            align-items: center;
            padding: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #calculator {
            width: 380px;
            background: linear-gradient(135deg, var(--calc-bg) 0%, #2a333d 100%);
            border-radius: 40px;
            padding: 30px 25px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.9), inset 0 2px 5px rgba(255,255,255,0.1);
            border: 2px solid #222;
            position: relative;
            user-select: none;
        }

        .brand-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 0 5px;
        }

        .brand-text { font-size: 11px; font-weight: bold; letter-spacing: 1.5px; color: #ccc; }
        .model-text { text-align: right; }
        .model-name { font-size: 20px; font-weight: 900; color: #fff; margin-bottom: -4px; }
        .multiview-tag { font-size: 13px; font-style: italic; color: #aaa; }

        #lcd-outer {
            background-color: #111;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 0 #222;
            position: relative;
        }

        #lcd-container {
            background-color: var(--lcd-bg);
            height: 150px;
            border-radius: 4px;
            padding: 10px;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            font-family: 'VT323', monospace;
            color: var(--text-lcd);
            position: relative;
            overflow: hidden;
        }

        .lcd-status {
            display: flex;
            justify-content: flex-end;
            font-size: 16px;
            font-weight: bold;
            height: 18px;
            gap: 12px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            margin-bottom: 4px;
        }

        #lcd-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #lcd-history {
            flex: 1;
            font-size: 22px;
            opacity: 0.9;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            border-bottom: 1px dashed rgba(0,0,0,0.05);
        }

        #lcd-input-line {
            font-size: 34px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            min-height: 40px;
            word-break: break-all;
            white-space: pre-wrap;
            position: relative;
        }

        .cursor {
            width: 14px;
            height: 28px;
            background-color: var(--text-lcd);
            display: inline-block;
            margin-left: 2px;
            animation: blink 1s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* Menu Overlay */
        #menu-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--menu-bg);
            color: var(--text-lcd);
            z-index: 100;
            display: none;
            padding: 15px;
            font-family: 'VT323', monospace;
        }

        .menu-title {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            border-bottom: 2px solid var(--text-lcd);
            margin-bottom: 10px;
        }

        .menu-item {
            padding: 6px;
            font-size: 22px;
            cursor: pointer;
        }

        .menu-item:hover {
            background-color: rgba(0,0,0,0.1);
        }

        /* Keypad Grid */
        .keypad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(9, 42px);
            gap: 20px 12px;
        }

        .btn-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .btn-label {
            position: absolute;
            top: -16px;
            width: 100%;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            color: var(--label-yellow);
            pointer-events: none;
            white-space: nowrap;
        }

        button {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--btn-shadow);
            transition: all 0.05s;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
            position: relative;
        }

        button::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.15), transparent);
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 var(--btn-shadow);
        }

        .btn-white { background-color: var(--btn-white); color: #000; }
        .btn-dark { background-color: var(--btn-dark); color: #fff; }
        .btn-green { background-color: var(--btn-green); color: #000; }
        .btn-green.active { background-color: #fff; box-shadow: 0 5px 0 #888; }

        .arrow-pad-container { grid-column: 4 / 6; grid-row: 1 / 3; display: flex; justify-content: center; align-items: center; }
        .arrow-pad { width: 110px; height: 110px; background-color: #1a1a1a; border-radius: 50%; display: grid; grid-template-areas: ". up ." "left . right" ". down ."; padding: 5px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.8); border: 2px solid #333; }
        .arrow-btn { background: #2a2a2a; box-shadow: none; width: 36px; height: 36px; font-size: 18px; color: #eee; }
        .up { grid-area: up; margin: 0 auto; } .down { grid-area: down; margin: 0 auto; } .left { grid-area: left; } .right { grid-area: right; }

        .btn-enter { grid-row: 8 / 10; grid-column: 5; height: auto; background-color: var(--btn-white); color: #000; font-size: 18px; border-radius: 12px; }

        #graph-panel {
            width: 700px;
            height: 800px;
            background-color: #fff;
            border-radius: 20px;
            padding: 20px;
            display: none;
            box-shadow: 0 30px 100px rgba(0,0,0,0.8);
            color: #333;
            border: 1px solid #ccc;
            z-index: 200;
            position: fixed;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            overflow-y: auto;
        }

        #table-display {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        #table-display th, #table-display td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        #table-display th {
            background-color: #f2f2f2;
        }

    </style>
</head>
<body>

    <div id="app-container">
        <div id="calculator">
            <div class="brand-header">
                <div class="brand-text">TEXAS INSTRUMENTS</div>
                <div class="model-text">
                    <div class="model-name">TI-30XS</div>
                    <div class="multiview-tag">MultiView</div>
                </div>
            </div>

            <div id="lcd-outer">
                <div id="lcd-container">
                    <div id="menu-overlay">
                        <div id="menu-title" class="menu-title">MENU</div>
                        <div id="menu-items"></div>
                    </div>
                    <div class="lcd-status">
                        <span id="ind-2nd"></span>
                        <span id="ind-hyp"></span>
                        <span id="ind-deg">DEG</span>
                    </div>
                    <div id="lcd-content">
                        <div id="lcd-history"></div>
                        <div id="lcd-input-line">0<span class="cursor"></span></div>
                    </div>
                </div>
            </div>

            <div class="keypad">
                <div class="btn-wrapper"><button class="btn-green" data-val="2nd" id="btn-2nd">2nd</button></div>
                <div class="btn-wrapper"><span class="btn-label">quit</span><button class="btn-dark" data-val="mode">mode</button></div>
                <div class="btn-wrapper"><span class="btn-label">insert</span><button class="btn-dark" data-val="del">delete</button></div>
                <div class="arrow-pad-container">
                    <div class="arrow-pad">
                        <button class="arrow-btn up" data-val="up">▲</button>
                        <button class="arrow-btn left" data-val="left">◀</button>
                        <button class="arrow-btn right" data-val="right">▶</button>
                        <button class="arrow-btn down" data-val="down">▼</button>
                    </div>
                </div>

                <div class="btn-wrapper"><span class="btn-label">Recall</span><button class="btn-dark" data-val="sci">x10<sup>n</sup></button></div>
                <div class="btn-wrapper"><span class="btn-label">10<sup>x</sup></span><button class="btn-dark" data-val="log">log</button></div>
                <div class="btn-wrapper"><span class="btn-label">angle</span><button class="btn-dark" data-val="prb">prb</button></div>
                <div class="btn-wrapper"><span class="btn-label">stat</span><button class="btn-dark" data-val="data">data</button></div>

                <div class="btn-wrapper"><span class="btn-label">e<sup>x</sup></span><button class="btn-dark" data-val="ln">ln</button></div>
                <div class="btn-wrapper"><span class="btn-label">U n/d</span><button class="btn-dark" data-val="frac">n/d</button></div>
                <div class="btn-wrapper"><button class="btn-dark" data-val="table">table</button></div>
                <div class="btn-wrapper"><button class="btn-dark" data-val="clear">clear</button></div>
                <div class="btn-wrapper"><button class="btn-dark" data-val="/">÷</button></div>

                <div class="btn-wrapper"><button class="btn-dark" data-val="hyp">hyp</button></div>
                <div class="btn-wrapper"><span class="btn-label">sin<sup>-1</sup></span><button class="btn-dark" data-val="sin">sin</button></div>
                <div class="btn-wrapper"><span class="btn-label">cos<sup>-1</sup></span><button class="btn-dark" data-val="cos">cos</button></div>
                <div class="btn-wrapper"><span class="btn-label">tan<sup>-1</sup></span><button class="btn-dark" data-val="tan">tan</button></div>
                <div class="btn-wrapper"><button class="btn-dark" data-val="*">×</button></div>

                <div class="btn-wrapper"><button class="btn-dark" data-val="pi">π</button></div>
                <div class="btn-wrapper"><span class="btn-label"><sup>x</sup>√</span><button class="btn-dark" data-val="^">^</button></div>
                <div class="btn-wrapper"><span class="btn-label">%</span><button class="btn-dark" data-val="(">(</button></div>
                <div class="btn-wrapper"><span class="btn-label">▶%</span><button class="btn-dark" data-val=")">)</button></div>
                <div class="btn-wrapper"><button class="btn-dark" data-val="-">−</button></div>

                <div class="btn-wrapper"><span class="btn-label">√</span><button class="btn-dark" data-val="sq">x<sup>2</sup></button></div>
                <div class="btn-wrapper"><button class="btn-white" data-val="7">7</button></div>
                <div class="btn-wrapper"><button class="btn-white" data-val="8">8</button></div>
                <div class="btn-wrapper"><button class="btn-white" data-val="9">9</button></div>
                <div class="btn-wrapper"><button class="btn-dark" data-val="+">+</button></div>

                <div class="btn-wrapper"><span class="btn-label">clear var</span><button class="btn-dark" data-val="x">x</button></div>
                <div class="btn-wrapper"><button class="btn-white" data-val="4">4</button></div>
                <div class="btn-wrapper"><button class="btn-white" data-val="5">5</button></div>
                <div class="btn-wrapper"><button class="btn-white" data-val="6">6</button></div>
                <div class="btn-wrapper"><button class="btn-dark" data-val="toggleFrac">f ↔ d</button></div>

                <div class="btn-wrapper"><span class="btn-label">recall</span><button class="btn-dark" data-val="sto">sto</button></div>
                <div class="btn-wrapper"><button class="btn-white" data-val="1">1</button></div>
                <div class="btn-wrapper"><button class="btn-white" data-val="2">2</button></div>
                <div class="btn-wrapper"><button class="btn-white" data-val="3">3</button></div>
                <button class="btn-enter" data-val="enter">enter</button>

                <div class="btn-wrapper"><span class="btn-label">off</span><button class="btn-dark" data-val="on">on</button></div>
                <div class="btn-wrapper"><span class="btn-label">reset</span><button class="btn-white" data-val="0">0</button></div>
                <div class="btn-wrapper"><button class="btn-white" data-val=".">.</button></div>
                <div class="btn-wrapper"><span class="btn-label">ans</span><button class="btn-white" data-val="neg">(-)</button></div>
            </div>
        </div>

        <div id="graph-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2 style="margin:0">Function Table / Graph</h2>
                <button onclick="toggleGraph()" style="width: 80px; height: 35px; box-shadow: none;">Close</button>
            </div>
            <div id="graph-display" style="width:100%; height:400px; background:#fafafa; border:1px solid #ccc; border-radius:8px;"></div>
            <div style="margin-top:15px; font-weight: bold; font-size: 20px; color: #222;">
                Plotting: <span id="graph-expr-label" style="color:#007bff">y = x</span>
            </div>
            <div id="numeric-table-container">
                <table id="table-display">
                    <thead>
                        <tr><th>x</th><th>f(x)</th></tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let inputBuffer = "";
        let is2nd = false;
        let isHyp = false;
        let angleMode = 'DEG';
        let ans = 0;
        let vars = { x: 0, y: 0, z: 0, t: 0, a: 0, b: 0, c: 0 };
        let menuVisible = false;
        let xPressCount = 0;
        let lastKeyPress = "";
        let cursorPos = 0;
        let calcState = 'STANDARD'; // STANDARD, TABLE_Y, TABLE_SETUP, TABLE_VIEW
        let tableSetup = { start: 0, step: 1, activeLine: 0 };

        const mathEngine = math.create(math.all);
        // Default to BigNumber but we will handle Fractions manually for MultiView feel
        mathEngine.config({ number: 'BigNumber', precision: 20 });

        const lcdInput = document.getElementById('lcd-input-line');
        const lcdHistory = document.getElementById('lcd-history');
        const ind2nd = document.getElementById('ind-2nd');
        const indHyp = document.getElementById('ind-hyp');
        const indDeg = document.getElementById('ind-deg');
        const btn2nd = document.getElementById('btn-2nd');
        const menuOverlay = document.getElementById('menu-overlay');

        function updateDisplay() {
            ind2nd.textContent = is2nd ? "2nd" : "";
            indHyp.textContent = isHyp ? "HYP" : "";
            indDeg.textContent = angleMode;
            if(is2nd) btn2nd.classList.add('active'); else btn2nd.classList.remove('active');

            if (calcState === 'STANDARD') {
                renderStandard();
            } else if (calcState === 'TABLE_Y') {
                renderTableY();
            } else if (calcState === 'TABLE_SETUP') {
                renderTableSetup();
            }
        }

        function renderStandard() {
            if (!inputBuffer && cursorPos === 0) {
                lcdInput.innerHTML = '0<span class="cursor"></span>';
                return;
            }
            renderMathPrint(inputBuffer, cursorPos);
        }

        function renderTableY() {
            lcdInput.innerHTML = '<div>y = </div>';
            let line = document.createElement('div');
            renderMathPrint(inputBuffer, cursorPos, line);
            lcdInput.appendChild(line);
        }

        function renderTableSetup() {
            lcdInput.innerHTML = '<div style="font-size: 24px;">TABLE SETUP</div>';
            let s1 = tableSetup.activeLine === 0 ? ">" : " ";
            let s2 = tableSetup.activeLine === 1 ? ">" : " ";
            lcdInput.innerHTML += `<div>${s1}Start=${tableSetup.start}</div>`;
            lcdInput.innerHTML += `<div>${s2}Step=${tableSetup.step}</div>`;
        }

        function renderMathPrint(buffer, pos, container) {
            try {
                let withCursor = buffer.slice(0, pos) + "\\cursor " + buffer.slice(pos);
                let latex = withCursor
                    .replace(/\\cursor /g, '{\\color{black}\\rule{2px}{1.2em}}')
                    .replace(/(\d+|\([^()]*\)|[a-z]) \/ (\d+|\([^()]*\)|[a-z])/g, '\\frac{$1}{$2}')
                    .replace(/ \/ /g, ' \\over ')
                    .replace(/ _ /g, ' ')
                    .replace(/π/g, '\\pi ')
                    .replace(/²/g, '^2')
                    .replace(/⁻¹/g, '^{-1}')
                    .replace(/√\(\s*/g, '\\sqrt{')
                    .replace(/sin\(/g, '\\sin(')
                    .replace(/cos\(/g, '\\cos(')
                    .replace(/tan\(/g, '\\tan(')
                    .replace(/asin\(/g, '\\sin^{-1}(')
                    .replace(/acos\(/g, '\\cos^{-1}(')
                    .replace(/atan\(/g, '\\tan^{-1}(')
                    .replace(/\*/g, '\\times ');

                let openBraces = (latex.match(/\{/g) || []).length;
                let closeBraces = (latex.match(/\}/g) || []).length;
                for(let i=0; i < openBraces - closeBraces; i++) latex += '}';

                let tempSpan = document.createElement('span');
                katex.render(latex, tempSpan, { throwOnError: false, displayMode: false });
                if (container) {
                    container.innerHTML = '';
                    container.appendChild(tempSpan);
                } else {
                    lcdInput.innerHTML = '';
                    lcdInput.appendChild(tempSpan);
                }
            } catch (e) {
                let html = buffer + '<span class="cursor"></span>';
                if (container) container.innerHTML = html; else lcdInput.innerHTML = html;
            }
        }

        function handleInput(val) {
            console.log("Input:", val, "is2nd:", is2nd, "state:", calcState);
            if (menuVisible) { hideMenu(); }
            if (is2nd && val !== '2nd') {
                is2nd = false; handle2ndAction(val); updateDisplay(); return;
            }

            if (calcState === 'TABLE_SETUP') {
                handleTableSetupInput(val);
                updateDisplay();
                return;
            }

            switch(val) {
                case '2nd': is2nd = !is2nd; break;
                case 'hyp': isHyp = !isHyp; break;
                case 'on': resetCalc(); break;
                case 'clear': inputBuffer = ""; cursorPos = 0; break;
                case 'del':
                    if (cursorPos > 0) {
                        inputBuffer = inputBuffer.slice(0, cursorPos - 1) + inputBuffer.slice(cursorPos);
                        cursorPos--;
                    }
                    break;
                case 'left': if (cursorPos > 0) cursorPos--; break;
                case 'right': if (cursorPos < inputBuffer.length) cursorPos++; break;
                case 'up': break;
                case 'down': break;
                case 'enter':
                    if (calcState === 'TABLE_Y') {
                        calcState = 'TABLE_SETUP';
                    } else {
                        evaluate();
                    }
                    break;
                case 'mode': showMenu('MODE', ['DEG', 'RAD'], (sel) => { angleMode = sel; hideMenu(); updateDisplay(); }); break;
                case 'neg': insertAtCursor("(-)"); break;
                case 'pi': insertAtCursor("π"); break;
                case 'log': insertAtCursor("log("); break;
                case 'ln': insertAtCursor("ln("); break;
                case 'sin': insertAtCursor(isHyp ? "sinh(" : "sin("); isHyp = false; break;
                case 'cos': insertAtCursor(isHyp ? "cosh(" : "cos("); isHyp = false; break;
                case 'tan': insertAtCursor(isHyp ? "tanh(" : "tan("); isHyp = false; break;
                case 'sq': insertAtCursor("²"); break;
                case 'inv': insertAtCursor("⁻¹"); break;
                case 'frac': insertAtCursor(" / "); break;
                case 'ans': insertAtCursor("ans"); break;
                case 'sci': insertAtCursor("*10^("); break;
                case 'table':
                    if (calcState === 'STANDARD') {
                        calcState = 'TABLE_Y';
                        inputBuffer = ""; cursorPos = 0;
                    } else {
                        calcState = 'STANDARD';
                    }
                    break;
                case 'toggleFrac': toggleDecFrac(); break;
                case 'prb': showPrbMenu(); break;
                case 'data': showDataMenu(); break;
                case 'sto': showStoMenu(); break;
                case 'x': handleXKey(); break;
                default: if(!isNaN(val) || "+-*/.^()".includes(val)) insertAtCursor(val);
            }
            updateDisplay();
        }

        function handle2ndAction(val) {
            switch(val) {
                case 'log': insertAtCursor("10^("); break;
                case 'ln': insertAtCursor("e^("); break;
                case 'sin': insertAtCursor("asin("); break;
                case 'cos': insertAtCursor("acos("); break;
                case 'tan': insertAtCursor("atan("); break;
                case 'sq': insertAtCursor("√( "); break;
                case '^': insertAtCursor("root("); break;
                case 'frac': insertAtCursor(" _ "); break;
                case 'table': toggleDecFrac(); break;
                case 'neg': insertAtCursor("ans"); break;
                case 'sto': showStoMenu(); break; // Actually 2nd STO is Recall
                case 'x': inputBuffer = ""; cursorPos = 0; break;
                case '0': resetCalc(); break;
                default: handleInput(val);
            }
        }

        function insertAtCursor(text) {
            inputBuffer = inputBuffer.slice(0, cursorPos) + text + inputBuffer.slice(cursorPos);
            cursorPos += text.length;
        }

        function evaluate() {
            if (!inputBuffer) return;
            console.log("Evaluating:", inputBuffer);
            try {
                let evalStr = inputBuffer
                    .replace(/π/g, 'PI')
                    .replace(/ans/g, `(${ans})`)
                    .replace(/\(-\)/g, '-')
                    .replace(/²/g, '^2')
                    .replace(/⁻¹/g, '^-1')
                    .replace(/log\(/g, 'log10(')
                    .replace(/ln\(/g, 'log(')
                    .replace(/√\(\s*/g, 'sqrt(')
                    .replace(/(\d+)\s*_\s*(\d+)\s*\/\s*(\d+)/g, '($1+$2/$3)')
                    .replace(/%/g, '/100');

                // Handle nCr and nPr by transforming them into function calls with balanced parens
                const transformInfix = (str, op, func) => {
                    let res = str;
                    while (res.includes(op)) {
                        let idx = res.indexOf(op);
                        let leftPart = res.substring(0, idx).trim();
                        let rightPart = res.substring(idx + op.length).trim();

                        let leftOp = "";
                        if (leftPart.endsWith(")")) {
                            let count = 0, i = leftPart.length - 1;
                            for (; i >= 0; i--) {
                                if (leftPart[i] === ")") count++;
                                else if (leftPart[i] === "(") count--;
                                if (count === 0) break;
                            }
                            leftOp = leftPart.substring(i);
                        } else {
                            let m = leftPart.match(/[0-9a-z.PI]+$/);
                            leftOp = m ? m[0] : "";
                        }

                        let rightOp = "";
                        if (rightPart.startsWith("(")) {
                            let count = 0, i = 0;
                            for (; i < rightPart.length; i++) {
                                if (rightPart[i] === "(") count++;
                                else if (rightPart[i] === ")") count--;
                                if (count === 0) break;
                            }
                            rightOp = rightPart.substring(0, i + 1);
                        } else {
                            let m = rightPart.match(/^[0-9a-z.PI]+/);
                            rightOp = m ? m[0] : "";
                        }

                        if (leftOp && rightOp) {
                            let replacement = `${func}(${leftOp}, ${rightOp})`;
                            let leftIdx = leftPart.lastIndexOf(leftOp);
                            let rightIdx = rightPart.indexOf(rightOp);
                            res = leftPart.substring(0, leftIdx) + replacement + rightPart.substring(rightIdx + rightOp.length);
                        } else { break; }
                    }
                    return res;
                };

                evalStr = transformInfix(evalStr, 'nCr', 'combinations');
                evalStr = transformInfix(evalStr, 'nPr', 'permutations');

                const customScope = {
                    sin: x => angleMode === 'DEG' ? mathEngine.sin(mathEngine.unit(x, 'deg')) : mathEngine.sin(x),
                    cos: x => angleMode === 'DEG' ? mathEngine.cos(mathEngine.unit(x, 'deg')) : mathEngine.cos(x),
                    tan: x => angleMode === 'DEG' ? mathEngine.tan(mathEngine.unit(x, 'deg')) : mathEngine.tan(x),
                    asin: x => angleMode === 'DEG' ? mathEngine.unit(mathEngine.asin(x), 'rad').toNumber('deg') : mathEngine.asin(x),
                    acos: x => angleMode === 'DEG' ? mathEngine.unit(mathEngine.acos(x), 'rad').toNumber('deg') : mathEngine.acos(x),
                    atan: x => angleMode === 'DEG' ? mathEngine.unit(mathEngine.atan(x), 'rad').toNumber('deg') : mathEngine.atan(x),
                    sinh: x => mathEngine.sinh(x),
                    cosh: x => mathEngine.cosh(x),
                    tanh: x => mathEngine.tanh(x),
                    asinh: x => mathEngine.asinh(x),
                    acosh: x => mathEngine.acosh(x),
                    atanh: x => mathEngine.atanh(x),
                    root: (a, b) => mathEngine.nthRoot(b, a),
                    x: vars.x,
                    y: vars.y || 0,
                    z: vars.z || 0,
                    t: vars.t || 0,
                    a: vars.a || 0,
                    b: vars.b || 0,
                    c: vars.c || 0
                };

                // Auto-close parentheses
                let openParen = (evalStr.match(/\(/g) || []).length;
                let closeParen = (evalStr.match(/\)/g) || []).length;
                for (let i = 0; i < openParen - closeParen; i++) {
                    evalStr += ")";
                }

                let result = mathEngine.evaluate(evalStr, customScope);

                // MultiView behavior: Try to keep results as fractions if no decimals were used in input
                let formattedResult;
                const hasDecimal = /[\.0-9]*\.[0-9]+/.test(inputBuffer);

                if (!hasDecimal && result % 1 !== 0) {
                    try {
                        let f = mathEngine.fraction(result);
                        if (f.d < 10000) {
                             formattedResult = f.n + " / " + f.d;
                        } else {
                             formattedResult = mathEngine.format(result, { precision: 12 });
                        }
                    } catch(e) {
                        formattedResult = mathEngine.format(result, { precision: 12 });
                    }
                } else {
                    formattedResult = mathEngine.format(result, { precision: 12 });
                }

                console.log("Result:", formattedResult);
                addToHistory(inputBuffer, formattedResult);
                ans = result;
                inputBuffer = formattedResult.toString();
                cursorPos = inputBuffer.length;
            } catch (e) {
                console.error(e); inputBuffer = "Error";
            }
            updateDisplay();
        }

        function showPrbMenu() {
            showMenu('PRB', ['nPr', 'nCr', '!', 'rand'], (sel) => {
                if(sel === '!') inputBuffer += "!"; else if(sel === 'rand') inputBuffer += "random()"; else inputBuffer += " " + sel + " ";
                hideMenu(); updateDisplay();
            });
        }

        function showDataMenu() { showMenu('DATA', ['L1', 'L2', 'L3'], hideMenu); }

        function showStoMenu() {
            showMenu('STORE', ['x', 'y', 'z', 't', 'a', 'b', 'c'], (sel) => {
                vars[sel] = ans;
                addToHistory("ans \\rightarrow " + sel, mathEngine.format(ans, {precision: 10}));
                hideMenu();
                updateDisplay();
            });
        }

        function handleXKey() {
            const varList = ['x', 'y', 'z', 't', 'a', 'b', 'c'];
            if (lastKeyPress === 'x') {
                // Remove last variable
                inputBuffer = inputBuffer.slice(0, cursorPos - 1) + inputBuffer.slice(cursorPos);
                cursorPos--;
                xPressCount = (xPressCount + 1) % varList.length;
            } else {
                xPressCount = 0;
            }
            insertAtCursor(varList[xPressCount]);
        }

        function showRecallMenu() {
            showMenu('RECALL', ['x', 'y', 'z', 't', 'a', 'b', 'c'], (sel) => {
                insertAtCursor(sel);
                hideMenu();
                updateDisplay();
            });
        }

        function showMenu(title, items, callback) {
            menuVisible = true;
            document.getElementById('menu-title').textContent = title;
            const container = document.getElementById('menu-items');
            container.innerHTML = "";
            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'menu-item';
                div.innerHTML = `<span>${index+1}: ${item}</span>`;
                div.onclick = (e) => { e.stopPropagation(); callback(item); };
                container.appendChild(div);
            });
            menuOverlay.style.display = 'block';
        }

        function hideMenu() { menuVisible = false; menuOverlay.style.display = 'none'; }

        function toggleDecFrac() {
            try {
                // Determine current state
                const hasSlash = inputBuffer.includes("/");
                const hasUnderscore = inputBuffer.includes("_");

                // We need the numeric value to convert
                let val;
                if (hasSlash) {
                    let evalStr = inputBuffer.replace(/(\d+)\s*_\s*(\d+)\s*\/\s*(\d+)/g, '($1+$2/$3)');
                    val = mathEngine.evaluate(evalStr);
                } else {
                    val = parseFloat(inputBuffer);
                }

                if (isNaN(val) || val === null) return;

                if (!hasSlash) {
                    // State: Decimal -> Simple Fraction
                    let f = mathEngine.fraction(val);
                    inputBuffer = f.n + " / " + f.d;
                } else if (!hasUnderscore && Math.abs(val) > 1) {
                    // State: Simple Fraction -> Mixed Fraction (only if |val| > 1)
                    let f = mathEngine.fraction(val);
                    let whole = Math.floor(f.n / f.d);
                    let rem = f.n % f.d;
                    if (rem === 0) {
                        inputBuffer = whole.toString();
                    } else {
                        inputBuffer = whole + " _ " + rem + " / " + f.d;
                    }
                } else {
                    // State: Mixed Fraction (or Simple < 1) -> Decimal
                    inputBuffer = mathEngine.format(val, { precision: 10 });
                }
            } catch(e) { console.error(e); }
            updateDisplay();
        }

        function addToHistory(expr, res) {
            const entry = document.createElement('div');
            entry.className = 'history-item';
            const exprSpan = document.createElement('span');
            const resSpan = document.createElement('span');
            let latexExpr = expr
                .replace(/(\d+)\s*_\s*(\d+)\s*\/\s*(\d+)/g, '$1\\frac{$2}{$3}')
                .replace(/(\d+)\s*\/\s*(\d+)/g, '\\frac{$1}{$2}')
                .replace(/π/g, '\\pi ')
                .replace(/√\(\s*/g, '\\sqrt{')
                .replace(/²/g, '^2')
                .replace(/⁻¹/g, '^{-1}');
            try { katex.render(latexExpr, exprSpan, { throwOnError: false, fontSize: '0.8em' }); resSpan.textContent = res; } catch(e) { exprSpan.textContent = expr; resSpan.textContent = res; }
            entry.appendChild(exprSpan); entry.appendChild(resSpan);
            lcdHistory.appendChild(entry);
            while (lcdHistory.childNodes.length > 3) lcdHistory.removeChild(lcdHistory.firstChild);
        }

        function resetCalc() {
            inputBuffer = ""; cursorPos = 0; ans = 0;
            lcdHistory.innerHTML = ""; is2nd = false; isHyp = false;
            hideMenu(); calcState = 'STANDARD';
            document.getElementById('graph-panel').style.display = 'none';
            updateDisplay();
        }

        let tableFieldEdited = false;
        function handleTableSetupInput(val) {
            if (val === 'up') { tableSetup.activeLine = 0; tableFieldEdited = false; }
            if (val === 'down') { tableSetup.activeLine = 1; tableFieldEdited = false; }
            if (val === 'enter') {
                calcState = 'STANDARD'; // Or TABLE_VIEW
                showGraphPanel();
                return;
            }
            if (!isNaN(val) || val === '.') {
                let current = tableSetup.activeLine === 0 ? tableSetup.start.toString() : tableSetup.step.toString();
                if (!tableFieldEdited) current = "";
                current += val;
                if (tableSetup.activeLine === 0) tableSetup.start = parseFloat(current) || 0;
                else tableSetup.step = parseFloat(current) || 1;
                tableFieldEdited = true;
            }
            if (val === 'del' || val === 'clear') {
                if (tableSetup.activeLine === 0) tableSetup.start = 0;
                else tableSetup.step = 1;
            }
        }

        function showGraphPanel() {
            const panel = document.getElementById('graph-panel');
            panel.style.display = 'block';
            plotGraph();
            generateTable();
        }

        function toggleGraph() {
            const panel = document.getElementById('graph-panel');
            panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
        }

        function plotGraph() {
            let expr = inputBuffer || "x";
            let plotExpr = expr
                .replace(/ans/g, ans.toString())
                .replace(/π/g, 'PI')
                .replace(/²/g, '^2')
                .replace(/⁻¹/g, '^-1')
                .replace(/√\(\s*/g, 'sqrt(');
            document.getElementById('graph-expr-label').textContent = "y = " + expr;
            try { functionPlot({ target: '#graph-display', data: [{ fn: plotExpr, sampler: 'builtIn', graphType: 'polyline' }], grid: true }); } catch (e) { console.error("Plot error", e); }
        }

        function generateTable() {
            let expr = inputBuffer || "x";
            let cleanExpr = expr
                .replace(/ans/g, ans.toString())
                .replace(/π/g, 'PI')
                .replace(/²/g, '^2')
                .replace(/⁻¹/g, '^-1')
                .replace(/√\(\s*/g, 'sqrt(');

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = "";
            let xVal = tableSetup.start;
            for (let i = 0; i < 10; i++) {
                let y;
                let x = xVal;
                try {
                    // Use a simple scope for table generation
                    const tableScope = { x: x, PI: Math.PI };
                    y = mathEngine.evaluate(cleanExpr, tableScope);
                    y = mathEngine.format(y, { precision: 6 });
                } catch (e) {
                    y = "Error";
                }
                const row = document.createElement('tr');
                row.innerHTML = `<td>${x}</td><td>${y}</td>`;
                tbody.appendChild(row);
                xVal += tableSetup.step;
            }
        }

        document.querySelectorAll('button').forEach(btn => {
            const val = btn.getAttribute('data-val');
            if (val) btn.addEventListener('click', (e) => {
                e.preventDefault();
                handleInput(val);
                lastKeyPress = val;
            });
        });
        updateDisplay();
    </script>
</body>
</html>
